<!-- ============ CHARACTER: droopy robot with a warning sign ============ -->
<g id="Robot">

	<!-- shadow -->
	<ellipse cx="250" cy="418" rx="95" ry="10" style="fill:#EBEBEB;"/>

	<!-- antenna -->
	<line x1="250" y1="120" x2="250" y2="95" style="stroke:#263238;stroke-width:4;stroke-linecap:round;"/>
	<circle cx="250" cy="88" r="9" style="fill:#407BFF;"/>
	<circle cx="246.5" cy="84.5" r="2.6" style="fill:#FFFFFF;opacity:0.7;"/>

	<!-- head -->
	<rect x="197" y="120" rx="18" ry="18" width="106" height="82" style="fill:#263238;"/>
	<rect x="207" y="130" rx="10" ry="10" width="86" height="62" style="fill:#407BFF;"/>

	<!-- eyes: sad/confused, one X one dash to read as "something's wrong" without numerals -->
	<g style="stroke:#FFFFFF;stroke-width:5;stroke-linecap:round;">
		<line x1="226" y1="150" x2="238" y2="162"/>
		<line x1="238" y1="150" x2="226" y2="162"/>
		<line x1="262" y1="156" x2="278" y2="156"/>
	</g>

	<!-- mouth: small worried curve -->
	<path d="M234,178 Q250,170 266,178" style="fill:none;stroke:#FFFFFF;stroke-width:4;stroke-linecap:round;"/>

	<!-- ear bolts -->
	<circle cx="192" cy="150" r="7" style="fill:#263238;"/>
	<circle cx="308" cy="150" r="7" style="fill:#263238;"/>

	<!-- neck -->
	<rect x="236" y="202" width="28" height="14" style="fill:#263238;"/>

	<!-- body -->
	<path d="M175,216 h150 a14,14 0 0 1 14,14 v100 a20,20 0 0 1 -20,20 h-138 a20,20 0 0 1 -20,-20 v-100
		a14,14 0 0 1 14,-14 z" style="fill:#263238;"/>
	<rect x="196" y="240" rx="8" ry="8" width="108" height="74" style="fill:#407BFF;"/>

	<!-- little status lights on chest -->
	<circle cx="214" cy="256" r="5" style="fill:#FFFFFF;opacity:0.85;"/>
	<circle cx="232" cy="256" r="5" style="fill:#FFFFFF;opacity:0.55;"/>
	<circle cx="250" cy="256" r="5" style="fill:#FFFFFF;opacity:0.3;"/>

	<!-- crack across chest screen to suggest malfunction -->
	<polyline points="220,278 236,296 226,300 248,314" style="fill:none;stroke:#FFFFFF;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0.9;"/>

	<!-- arms -->
	<path d="M175,232 q-28,4 -34,36 l14,40" style="fill:none;stroke:#263238;stroke-width:16;stroke-linecap:round;"/>
	<circle cx="153" cy="310" r="14" style="fill:#263238;"/>

	<path d="M325,232 q26,6 30,40" style="fill:none;stroke:#263238;stroke-width:16;stroke-linecap:round;"/>
	<circle cx="357" cy="278" r="14" style="fill:#263238;"/>

	<!-- legs -->
	<rect x="205" y="345" width="26" height="55" rx="10" style="fill:#263238;"/>
	<rect x="269" y="345" width="26" height="55" rx="10" style="fill:#263238;"/>
	<ellipse cx="218" cy="404" rx="22" ry="10" style="fill:#407BFF;"/>
	<ellipse cx="282" cy="404" rx="22" ry="10" style="fill:#407BFF;"/>

</g>

<!-- ============ WARNING SIGN the robot is looking at ============ -->
<g id="Warning_Sign">
	<path d="M382,318 l40,72 h-80 z" style="fill:#FFFFFF;stroke:#263238;stroke-width:7;stroke-linejoin:round;"/>
	<rect x="378" y="337" width="8" height="26" rx="4" style="fill:#263238;"/>
	<circle cx="382" cy="375" r="4.5" style="fill:#263238;"/>
</g>

<!-- a couple of loose bolts / debris near the robot's feet for extra character -->
<g style="fill:#263238;">
	<circle cx="140" cy="405" r="4"/>
	<circle cx="360" cy="400" r="3.5"/>
</g>

</svg>
